<style>
/* Layout: one-column console — plan overview with live module first, then the year's activities; sensor module = month strip, then month table */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e6eaee; --line:#d3dae1;
  --fg:#16202a; --muted:#5b6977; --accent:#1d5d8a; --accent-ink:#ffffff; --accent-soft:#d9e7f1;
  --ok:#1b7a4b; --ok-soft:#d9f0e3; --warn:#a46200; --warn-soft:#faead0; --bad:#b3261e; --bad-soft:#f7dad7; --na:#7a8794; --na-soft:#e4e9ed;
  --f-body:"IBM Plex Sans","Segoe UI",Roboto,sans-serif;
  --f-disp:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1319; --surface:#151e27; --sunk:#1b2630; --line:#283744;
  --fg:#e5ecf2; --muted:#92a2b0; --accent:#69ade0; --accent-ink:#0a1520; --accent-soft:#1b3245;
  --ok:#5ac88d; --ok-soft:#163325; --warn:#e8a94a; --warn-soft:#382a12; --bad:#f08a80; --bad-soft:#3b1a18; --na:#8695a2; --na-soft:#22303b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1319; --surface:#151e27; --sunk:#1b2630; --line:#283744;
  --fg:#e5ecf2; --muted:#92a2b0; --accent:#69ade0; --accent-ink:#0a1520; --accent-soft:#1b3245;
  --ok:#5ac88d; --ok-soft:#163325; --warn:#e8a94a; --warn-soft:#382a12; --bad:#f08a80; --bad-soft:#3b1a18; --na:#8695a2; --na-soft:#22303b;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;padding:0 16px 48px}
.wrap{max-width:1100px;margin:0 auto}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0}
button:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:38px;height:38px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand h1{font-size:1.3rem;font-weight:700}
.brand p{margin:0;color:var(--muted);font-size:.82rem}
.badge-demo{font-size:.7rem;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
main{padding-top:20px;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

/* featured module */
.feature{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:center}
@media (max-width:700px){.feature{grid-template-columns:1fr}}

.big{font-family:var(--f-mono);font-size:2.6rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}

.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}

/* month strip */
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;overflow-x:auto}
@media (max-width:700px){.months{grid-template-columns:repeat(6,minmax(0,1fr))}}
.mo{font:inherit;color:var(--fg);border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0;position:relative}
.mo .m{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.mo .v{font-family:var(--f-mono);font-size:.86rem;font-weight:600;font-variant-numeric:tabular-nums}
.mo.ok{background:var(--ok-soft);border-color:transparent} .mo.ok .v{color:var(--ok)}
.mo.warn{background:var(--warn-soft);border-color:transparent} .mo.warn .v{color:var(--warn)}
.mo.bad{background:var(--bad-soft);border-color:transparent} .mo.bad .v{color:var(--bad)}
.mo.ksd{background:var(--sunk);border-color:transparent} .mo.ksd .v{color:var(--muted);font-family:var(--f-body);font-size:.74rem}
.mo.due{border:1.5px dashed var(--accent)} .mo.due .v{color:var(--accent);font-family:var(--f-body);font-size:.74rem}
.mo.future{opacity:.5;cursor:default}
.mo[aria-current="true"]{box-shadow:0 0 0 2px var(--accent)}
.mo:not(.future):hover{border-color:var(--accent)}

/* activities */
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.group h3{font-size:.95rem;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.group h3 span{font-family:var(--f-mono);color:var(--muted);font-weight:500;font-size:.8rem}
.acts{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.act{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:.88rem;background:var(--surface)}
.act:last-child{border-bottom:0}
a.act{color:var(--fg);text-decoration:none}
a.act:hover{background:var(--accent-soft)}
.tag{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:4px;white-space:nowrap}
.tag.live{color:var(--ok);background:var(--ok-soft)} .tag.live::before{display:none}
.tag.next{color:var(--muted);background:var(--sunk)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-na{background:var(--na-soft);color:var(--na)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--sunk);border-radius:var(--r);padding:12px 14px}
.kpi .k{color:var(--muted);font-size:.78rem}
.kpi .v{font-family:var(--f-mono);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .h{font-size:.76rem;color:var(--muted)}

.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.86rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--sunk);font-weight:600;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td .code{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);margin-inline-start:6px}
tbody tr.pick{cursor:pointer}
tbody tr.pick:hover td:first-child,tbody tr[aria-current="true"] td:first-child{color:var(--accent)}
tbody tr[aria-current="true"] td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.flag{display:block;font-size:.75rem;color:var(--warn);margin-top:2px}
tr.excl td{color:var(--na)}
.side{display:flex;flex-direction:column;gap:12px}
.chart svg{display:block;width:100%;height:auto}
.note{font-size:.84rem;background:var(--sunk);border-radius:6px;padding:10px 12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:.84rem}
.meta b{color:var(--fg);font-weight:600}
.btn{font:inherit;font-weight:600;font-size:.86rem;border-radius:6px;padding:8px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;display:inline-flex;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.link{border-color:transparent;background:none;color:var(--muted);padding-inline:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
input{font:inherit;font-size:.9rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
input.numin{font-family:var(--f-mono);text-align:right;width:100%;min-width:90px}
input[aria-invalid="true"]{border-color:var(--bad);background:var(--bad-soft)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty h3{color:var(--fg);font-size:1.1rem;margin-bottom:6px}
.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.88rem;font-weight:600;z-index:5}
footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center}
footer p{margin:0;max-width:75ch}
.livegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.mod{display:flex;flex-direction:column;gap:14px}
.mod .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.mod h2{font-size:1.3rem;font-weight:700;margin-top:4px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px}
.chips .mo.add{border-style:dashed;color:var(--accent)} .chips .mo.add .v{font-family:var(--f-body);font-size:.78rem}
.mo.empty .v{color:var(--muted);font-family:var(--f-body);font-size:.74rem}
.findings{display:flex;flex-direction:column;gap:8px}
.finding{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.finding .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;grid-row:1/3}
.finding .ic.bad{background:var(--bad-soft);color:var(--bad)} .finding .ic.warn{background:var(--warn-soft);color:var(--warn)}
.finding b{font-size:.92rem}
.finding p{margin:0;font-size:.84rem;color:var(--muted)}
td.loc{font-weight:600}
tr.gstart td{border-top:2px solid var(--line)}
</style>

<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/><circle cx="12" cy="16" r="1.4" fill="var(--accent-ink)"/></svg></div>
      <div><h1>Master Plan KCML</h1><p>Process engineering activities · 2026</p></div>
    </div>
    <span class="badge-demo">Demo</span>
  </header>
  <main id="app"></main>
  <footer>
    <p>Demo version. Data is stored in this browser only. The production system runs on a server inside the plant network with one shared database for every device, user accounts, Excel export and printable reports.</p>
    <button class="btn link" id="resetBtn">Reset demo data</button>
  </footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== the Master Plan, from the team's 2026 Drive folder ===== */
const PLAN=[
 {g:"Kiln & pyroprocessing",items:["Kiln audit","Kiln shutdown inspection","Kiln shell scanner","Kiln EP dust drop test & kiln feed bin losses","P.H & kiln, cooler 1st level inspection","P.H false air measurements","Burner audit","Burner flame setting & inspection","Bypass % – flow measurement","Monitor volatiles input and output","Clinker cooler fans flow measurements","Pyro line major fans audit"]},
 {g:"Instruments & analyzers",items:["Critical sensor check","Gas analyzers cross check"]},
 {g:"Mills & dedusting",items:["RM audit","CM master plan activities","Bag filters measurements"]},
 {g:"Utilities & reporting",items:["Compressors","Energy consumption","RMs & kiln reports"]}
];

/* ===== critical sensor check ===== */
const POINTS=[
 {id:"SAT",name:"Secondary air temp",u:"°C"},{id:"TAT",name:"Tertiary air temp",u:"°C"},
 {id:"P20",name:"ID fan inlet press",u:"mbar"},{id:"T04",name:"PH outlet temp",u:"°C"},
 {id:"P04",name:"PH outlet press",u:"mbar"},{id:"T33",name:"Kiln inlet temp",u:"°C"},
 {id:"P05",name:"Kiln inlet pressure",u:"mbar"},{id:"T11",name:"Material temp left",u:"°C"},
 {id:"T12",name:"Material temp right",u:"°C"},{id:"T09",name:"Gas outlet temp left",u:"°C"},
 {id:"T10",name:"Gas outlet temp right",u:"°C"},{id:"CLK",name:"Clinker temp",u:"°C"}];
const N=null,XL="Imported from Excel";
const SEED={
 1:{op:XL,v:[[1080,1090],[682,675],[-61,-60],[446,432],[-58,-51],[1052,980],[-5,-3],[814,824],[850,856],[880,870],[915,900],[100,50]]},
 2:{op:XL,v:[[1066,1089],[734,687],[-61,-62],[450,448],[-56,-59],[1044,1048],[-7,-6],[861,860],[881,885],[888,895],[902,900],[N,N]]},
 3:{ksd:true,op:XL},
 4:{day:19,op:XL,v:[[1098,1100],[822,819],[-66.8,-62],[441,439],[-61.18,-59],[1073,990],[-6,N],[846,842],[844,848],[883,900],[871,882],[164,155]]},
 5:{op:XL,v:[[1212,1188],[744,750],[-63,-62],[435.2,440],[-58,-59],[1111,920],[-7,-5.9],[866,853],[865,847],[899,878],[902,905],[N,N]]},
 6:{op:XL,v:[[1214,1180],[634,650],[-61,-62],[424,420],[-58,-57],[1085,999],[-6,-4.5],[827,834],[848,850],[885,865],[896,900],[N,N]]},
 7:{day:14,op:XL,v:[[1190,1192],[N,N],[-56,N],[412,411],[-51,-47],[1064,980],[-6,-3.5],[848,846],[846,856],[899,878],[902,905],[N,N]]},
 8:{op:XL,v:[[677,675],[1064,1085],[-56.8,-56],[426,430],[-53.2,-51],[1032,922],[-5,-5],[848,858],[869,871.5],[842,871],[903,884],[N,N]]},
 9:{op:XL,v:[[1016,1023],[641,660],[-54,-55],[428,422],[-52,-49],[1064,980],[-4.54,-6],[848,844],[845,846],[851,853],[842,844],[N,N]]}
};
const KEY="kcml-plan-demo-v1";
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&typeof s==="object")return s}catch(e){}return JSON.parse(JSON.stringify(SEED))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DATA))}catch(e){}}
let DATA=load();
const NOW=new Date();const CUR=NOW.getFullYear()===2026?NOW.getMonth()+1:(NOW.getFullYear()>2026?13:0);
const UI={month:null,sensor:null,edit:false};

const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MS=MONTHS.map(m=>m.slice(0,3));
const isNum=x=>typeof x==="number"&&isFinite(x);
function calc(p,c){if(!isNum(p)||!isNum(c)||p===0)return {ok:false,diff:null,err:null};const d=p-c;return {ok:true,diff:d,err:d/p}}
function cls(e){if(e==null)return "na";const a=Math.abs(e);return a<=.02?"ok":a<=.05?"warn":"bad"}
function accCls(a){if(a==null)return "na";return a>=.98?"ok":a>=.95?"warn":"bad"}
const TXT={ok:"In tolerance",warn:"Watch",bad:"Calibrate",na:"Missing"};
const pct=(x,d=1)=>x==null?"—":(x*100).toFixed(d)+"%";
const fmt=x=>x==null?"—":(Math.round(x*100)/100).toString();
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function summary(v,signed){const e=v.map(([p,c])=>calc(p,c)).filter(r=>r.ok).map(r=>r.err);if(!e.length)return {acc:null,n:0,ok:0,warn:0,bad:0};
 const avg=signed?e.reduce((a,x)=>a+x,0)/e.length:e.reduce((a,x)=>a+Math.abs(x),0)/e.length;const c={ok:0,warn:0,bad:0};e.forEach(x=>c[cls(x)]++);return {acc:1-avg,n:e.length,...c}}
const done=()=>Object.keys(DATA).map(Number).filter(m=>DATA[m]&&DATA[m].v).sort((a,b)=>a-b);
const mLabel=m=>(DATA[m]&&DATA[m].day?DATA[m].day+" ":"")+MONTHS[m-1]+" 2026";
function flags(m,i){const out=[];const v=DATA[m].v;const [p,c]=v[i];
 if(i===0&&isNum(p)&&isNum(v[1][0])&&p<v[1][0])out.push("Lower than TAT; SAT and TAT may be swapped");
 if(i===1&&isNum(p)&&isNum(v[0][0])&&p>v[0][0])out.push("Higher than SAT; SAT and TAT may be swapped");
 if(isNum(p)&&isNum(c)){const d=done().find(k=>k<m&&DATA[k].v[i][0]===p&&DATA[k].v[i][1]===c);if(d)out.push("Same as "+MS[d-1]+"; check it wasn't copied")}
 if(isNum(p)!==isNum(c))out.push("One reading missing");return out}
function nextDue(){for(let m=1;m<=Math.min(12,CUR);m++)if(!DATA[m])return m;return null}

function monthStrip(){
 return `<div class="months" role="list">${MS.map((n,k)=>{const m=k+1;const d=DATA[m];let c="",val="—";
  if(d&&d.ksd){c="ksd";val="KSD"}else if(d&&d.v){const s=summary(d.v);c=accCls(s.acc);val=pct(s.acc)}
  else if(m<=CUR){c="due";val=m===CUR?"Due":"Missed"}else c="future";
  return `<button class="mo ${c}" role="listitem" data-m="${m}" ${c==="future"?'disabled':''} aria-current="${UI.month===m}" aria-label="${MONTHS[k]}: ${val}"><span class="m">${n}</span><span class="v">${val}</span></button>`}).join("")}</div>`}

/* ===== SENSOR MODULE ===== */
function renderSensors(){
 const ds=done();if(UI.month==null)UI.month=ds[ds.length-1]||nextDue()||1;
 const m=UI.month;const d=DATA[m];
 document.getElementById("app").innerHTML=`
 <nav class="crumbs"><a href="#">Master Plan</a> / Instruments &amp; analyzers / <span style="color:var(--fg)">Critical sensor check</span></nav>
 <section class="panel">
  <div class="ph"><div><span class="eyebrow">2026 · monthly</span><h2>Critical sensor check</h2><p class="sub">Select a month. Colors show the month's accuracy: green ≥ 98%, amber 95–98%, red below 95%.</p></div></div>
  ${monthStrip()}
 </section>
 <section id="monthPanel">${(!d||UI.edit)&&!(d&&d.ksd&&!UI.edit)?formPanel(m):d.ksd?ksdPanel(m):monthPanel(m)}</section>`;
 document.querySelectorAll(".mo[data-m]").forEach(b=>b.addEventListener("click",()=>{UI.month=+b.dataset.m;UI.edit=false;renderSensors()}));
 bindMonth(m);
}
function ksdPanel(m){return `<div class="panel"><div class="empty"><h3>${MONTHS[m-1]}: kiln shutdown (KSD)</h3><p>No readings this month. Shutdown months are left out of the averages instead of showing as errors.</p>
 <button class="btn" id="editBtn">Record readings instead</button></div></div>`}
function monthPanel(m){
 const d=DATA[m];const s=summary(d.v),x=summary(d.v,true);
 const ds=done();const prev=ds.filter(k=>k<m).pop();const ps=prev?summary(DATA[prev].v):null;
 const delta=ps&&s.acc!=null?(s.acc-ps.acc)*100:null;
 if(UI.sensor==null){let w=0,wv=-1;d.v.forEach(([p,c],i)=>{const r=calc(p,c);if(r.ok&&Math.abs(r.err)>wv){wv=Math.abs(r.err);w=i}});UI.sensor=w}

 else if(avg>.05&&Math.abs(bias)>.6*avg)tip=`Steady offset: CCR reads ${bias>0?"lower":"higher"} than the field by about ${pct(Math.abs(bias))}. Likely needs a transmitter re-zero or span check.`;

function gstat(pt,p,c){if(!isNum(p)||!isNum(c))return {k:"na",diff:null,err:null};const diff=p-c;const [a,b]=gtol(pt,p);const d=Math.abs(diff);

function gfindings(){const out=[];
 GPOINTS.forEach((pt,i)=>{
  const air=GDATA.filter(r=>pt.k==="o2"&&isNum(r.v[i][0])&&r.v[i][0]>=19.5);
  if(air.length>=3)out.push({s:"bad",t:`${ptName(pt)} reads like ambient air`,d:`Field O₂ was 19.5% or higher in ${air.length} rounds (${air.map(gLabel).join(", ")}). Air is 20.9%, so the sample line is likely drawing in air. Check the probe and filter before trusting this analyzer.`});
  const flat=GDATA.filter(r=>r.v[i][0]===1&&r.v[i][1]===1);
  if(flat.length>=4)out.push({s:"warn",t:`${ptName(pt)} shows 1 ppm every round`,d:`Both field and CCR read exactly 1 ppm in ${flat.length} rounds. A value that never moves usually means a saturated cell or a reading below the analyzer range, so this check proves nothing about accuracy.`});
  const ratio=GDATA.filter(r=>{const [p,c]=r.v[i];return pt.k==="ppm"&&isNum(p)&&isNum(c)&&c>0&&p/c>1.6&&p/c<2.4});
  if(ratio.length>=3)out.push({s:"bad",t:`${ptName(pt)}: field reads about twice the CCR`,d:`In ${ratio.length} rounds (${ratio.map(gLabel).join(", ")}) the field value is 1.6 to 2.4 times the CCR value. A steady ratio like this points to a units or O₂-reference correction mismatch (ppm vs mg/m³, dry vs corrected), not random error.`});
  const zero=GDATA.filter(r=>isNum(r.v[i][0])&&r.v[i][1]===0&&r.v[i][0]>2);

  </div>`:""}
  <div class="split">
   <div class="tablewrap"><table><thead><tr><th>Location</th><th>Gas</th><th class="n">Field</th><th class="n">CCR</th><th class="n">Diff.</th><th class="n">Error</th><th>Tolerance</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>
   <aside class="side" id="gSide">${gSide()}</aside>
  </div>
  <p class="sub" style="margin-top:10px">O₂ is judged by absolute difference; CO and NOx by percent with a 20 ppm floor, so near-zero readings don't inflate the error. Demo tolerances: the team sets the real ones.</p>
 </div>`}
function gSide(){
 const i=GUI.pt;const pt=GPOINTS[i];const o2=pt.k==="o2";
 const pts=GDATA.map((r,ri)=>{const [p,c]=r.v[i];const st=gstat(pt,p,c);return {ri,r,st,y:st.k==="na"?null:(o2?st.diff:st.err)}});
 const real=pts.filter(x=>x.y!=null);const band=o2?.5:.10;
 let lim=Math.max(band*3,...real.map(x=>Math.abs(x.y)));lim=o2?Math.ceil(lim*2)/2:Math.ceil(lim*10)/10;if(!o2&&lim>2)lim=2;
 const W=320,H=180,L=44,R=8,T=14,B=28;const x=k=>L+(pts.length<2?(W-L-R)/2:k*(W-L-R)/(pts.length-1));const y=v=>T+(lim-Math.max(-lim,Math.min(lim,v)))/(2*lim)*(H-T-B);
 const lab=v=>o2?(v>0?"+":"")+v.toFixed(1):Math.round(v*100)+"%";
 let g=`<rect x="${L}" y="${y(band)}" width="${W-L-R}" height="${y(-band)-y(band)}" fill="var(--ok)" opacity=".12"/>`;
 [lim,0,-lim].forEach(t=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" ${t===0?'stroke-width="1.5"':''}/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${lab(t)}</text>`});
 let d="",st=true;pts.forEach((p,k)=>{if(p.y==null){st=true;return}d+=(st?"M":"L")+x(k)+" "+y(p.y)+" ";st=false});
 g+=`<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
 pts.forEach((p,k)=>{g+=`<text x="${x(k)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="${p.ri===GUI.round?"var(--accent)":"var(--muted)"}" font-weight="${p.ri===GUI.round?600:400}">${MS[p.r.m-1][0]}</text>`;
  if(p.y!=null){const clipped=Math.abs(p.y)>lim;g+=`<circle cx="${x(k)}" cy="${y(p.y)}" r="${p.ri===GUI.round?5.5:4}" fill="var(--${p.st.k})" stroke="var(--surface)" stroke-width="1.5"/>${clipped?`<text x="${x(k)}" y="${y(p.y)+(p.y>0?-8:14)}" text-anchor="middle" font-size="9" fill="var(--bad)">${lab(p.y)}</text>`:""}`}});
 const c={ok:0,warn:0,bad:0};real.forEach(p=>c[p.st.k]++);
 return `<div><span class="eyebrow">Analyzer history</span><h3 style="font-size:1.05rem;margin-top:2px">${pt.loc} · ${pt.gas}</h3><p class="sub">${o2?"Difference in vol% (band ±0.5)":"Error % (band ±10%); values beyond ±"+Math.round(lim*100)+"% are pinned to the edge"}</p></div>
  <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${ptName(pt)} history">${g}</svg></div>
  <div class="meta"><span>Rounds OK <b>${c.ok}</b></span><span>Borderline <b>${c.warn}</b></span><span>Out <b style="color:var(--bad)">${c.bad}</b></span></div>`}
function gForm(){
 const editing=GUI.form==="edit";const r=editing?GDATA[GUI.round]:null;const v=r?r.v:E12();
 const today=new Date();const iso=r?`2024-${String(r.m).padStart(2,"0")}-${String(r.day||1).padStart(2,"0")}`:today.toISOString().slice(0,10);
 let lastLoc="";
 return `<div class="panel"><div class="ph"><div><span class="eyebrow">${editing?"Edit":"New"} round</span><h2>${editing?gLabel(r):"Gas analyzers cross check"}</h2><p class="sub">Status updates as you type. Leave a field empty if the reading wasn't taken.</p></div></div>
 <form id="gf" novalidate>
  <div class="formgrid"><label class="f" for="gf-date">Date<input type="date" id="gf-date" value="${iso}"></label>
   <label class="f" for="gf-op">Recorded by<input type="text" id="gf-op" value="${r&&r.op!==XL?esc(r.op):""}" placeholder="e.g. Eng. Zahraa"></label></div>
  <div class="tablewrap"><table><thead><tr><th>Location</th><th>Gas</th><th class="n">Field</th><th class="n">CCR</th><th class="n">Diff.</th><th>Status</th></tr></thead><tbody>
  ${GPOINTS.map((pt,i)=>{const nl=pt.loc!==lastLoc;lastLoc=pt.loc;return `<tr class="${nl&&i?"gstart":""}"><td class="loc">${nl?pt.loc:""}</td><td>${pt.gas} <span class="code">${pt.u}</span></td>
   <td><input class="numin" inputmode="decimal" id="gp${i}" value="${v[i][0]??""}" aria-label="${ptName(pt)} field"></td>
   <td><input class="numin" inputmode="decimal" id="gc${i}" value="${v[i][1]??""}" aria-label="${ptName(pt)} CCR"></td>
   <td class="n" id="gd${i}">—</td><td id="gs${i}"></td></tr>`}).join("")}
  </tbody></table></div>
  <div class="row" style="justify-content:space-between;margin-top:14px"><div class="meta" id="gf-sum"></div>
   <div class="row"><button type="button" class="btn" id="gCancel">Cancel</button><button type="submit" class="btn primary">Save round</button></div></div>
  <p id="gf-err" style="color:var(--bad);font-size:.85rem;margin:8px 0 0" hidden></p>
 </form></div>`}
function gRead(){let bad=false;const v=GPOINTS.map((_,i)=>{const a=document.getElementById("gp"+i),b=document.getElementById("gc"+i);const p=parseIn(a.value),c=parseIn(b.value);a.setAttribute("aria-invalid",p.bad);b.setAttribute("aria-invalid",c.bad);if(p.bad||c.bad)bad=true;return [p.v,c.v]});return {v,bad}}
function gLive(){const {v}=gRead();v.forEach(([p,c],i)=>{const st=gstat(GPOINTS[i],p,c);document.getElementById("gd"+i).textContent=st.diff==null?"—":fmt(st.diff);
 document.getElementById("gs"+i).innerHTML=`<span class="pill p-${st.k}">${st.k==="ok"?"OK":st.k==="bad"?"Out":TXT[st.k]}</span>`});
 const s=gsum({v});document.getElementById("gf-sum").innerHTML=`<span>Measured <b>${s.n}/12</b></span><span>Reliability <b class="num">${pct(s.rel,0)}</b></span><span>Out <b>${s.bad}</b></span>`}
function bindGas(){
 const ge=document.getElementById("gEdit");if(ge)ge.addEventListener("click",()=>{GUI.form="edit";renderGas()});
 document.querySelectorAll("#gPanel tr.pick").forEach(r=>{const f=()=>{GUI.pt=+r.dataset.i;document.querySelectorAll("#gPanel tr.pick").forEach(x=>x.setAttribute("aria-current",x===r));document.getElementById("gSide").innerHTML=gSide()};r.addEventListener("click",f);r.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();f()}})});
 const form=document.getElementById("gf");if(!form)return;form.addEventListener("input",gLive);gLive();
 document.getElementById("gCancel").addEventListener("click",()=>{GUI.form=null;renderGas()});
 form.addEventListener("submit",e=>{e.preventDefault();const err=document.getElementById("gf-err");const {v,bad}=gRead();const op=document.getElementById("gf-op").value.trim();const date=document.getElementById("gf-date").value;
  const msg=!date?"Choose the date.":!op?"Enter who recorded the readings.":bad?"Some fields contain text instead of a number. Correct them or leave them empty.":gsum({v}).n===0?"Enter both readings for at least one analyzer.":"";
  if(msg){err.textContent=msg;err.hidden=false;return}
  const [,mm,dd]=date.split("-").map(Number);
  if(GUI.form==="edit"){Object.assign(GDATA[GUI.round],{v,op,m:mm,day:dd});}else{GDATA.push({id:"g"+Date.now(),m:mm,day:dd,op,xl:null,v});GUI.round=GDATA.length-1}
  gsave();GUI.form=null;GUI.pt=null;renderGas();toast("Round saved")});
}

/* ===== HOME ===== */
function renderHome(){
 const ds=done();const last=ds[ds.length-1];const s=last?summary(DATA[last].v):null;const sc=s?accCls(s.acc):"na";
 const gl=GDATA[GDATA.length-1];const gs=gsum(gl);const gc=relCls(gs.rel);const F=gfindings();
 const total=PLAN.reduce((a,g)=>a+g.items.length,0);
 const LIVE={"Critical sensor check":"#sensors","Gas analyzers cross check":"#gas"};
 document.getElementById("app").innerHTML=`
 <div class="livegrid">
  <section class="panel mod">
   <div class="head"><div><span class="live">Live module</span><h2>Critical sensor check</h2><p class="sub">12 kiln-line sensors · field vs. CCR · monthly</p></div>
    <div style="text-align:right"><div class="eyebrow">Accuracy · ${last?MS[last-1]:"—"}</div><div class="big" style="font-size:2.2rem;color:var(--${sc==="na"?"fg":sc})">${s?pct(s.acc):"—"}</div></div></div>
   ${monthStrip()}
   <div class="row" style="justify-content:space-between"><span class="sub" style="margin:0">${s?`${s.bad} sensors need calibration`:""}${nextDue()?` · <b style="color:var(--accent)">${MONTHS[nextDue()-1]} due</b>`:""}</span><a class="btn primary" href="#sensors">Open</a></div>
  </section>
  <section class="panel mod">
   <div class="head"><div><span class="live">Live module</span><h2>Gas analyzers cross check</h2><p class="sub">5 analyzers · O₂, CO, NOx · ${GDATA.length} rounds</p></div>
    <div style="text-align:right"><div class="eyebrow">Reliability · ${gLabel(gl)}</div><div class="big" style="font-size:2.2rem;color:var(--${gc==="na"?"fg":gc})">${pct(gs.rel,0)}</div></div></div>
   ${gStrip().replace(/<button class="mo add"[\s\S]*?<\/button>/,"")}
   <div class="row" style="justify-content:space-between"><span class="sub" style="margin:0">${gs.bad} readings out of tolerance · <b style="color:var(--bad)">${F.length} issues found</b></span><a class="btn primary" href="#gas">Open</a></div>
  </section>
 </div>
 <section class="panel">
  <div class="ph"><div><span class="eyebrow">2026 plan</span><h2>All activities</h2><p class="sub">${total} activities from the team's Master Plan folder. ${Object.keys(LIVE).length} are live; each of the others becomes a module the same way.</p></div></div>
  <div class="groups">${PLAN.map(g=>`<div class="group"><h3>${g.g}<span>${g.items.length}</span></h3><div class="acts">
   ${g.items.map(it=>LIVE[it]?`<a class="act" href="${LIVE[it]}"><span>${it}</span><span class="tag live">Live</span></a>`:`<div class="act"><span>${it}</span><span class="tag next">Next</span></div>`).join("")}
  </div></div>`).join("")}</div>
 </section>`;
 document.querySelectorAll(".mo[data-m]").forEach(b=>b.addEventListener("click",()=>{UI.month=+b.dataset.m;UI.edit=false;location.hash="sensors"}));
 document.querySelectorAll(".mo[data-g]").forEach(b=>b.addEventListener("click",()=>{GUI.round=+b.dataset.g;GUI.form=null;GUI.pt=null;location.hash="gas"}));
}

/* ===== routing ===== */
function route(){if(location.hash==="#sensors")renderSensors();else if(location.hash==="#gas")renderGas();else renderHome()}
window.addEventListener("hashchange",()=>{route();window.scrollTo({top:0})});
let rArm=false;const rb=document.getElementById("resetBtn");rb.addEventListener("click",()=>{if(!rArm){rArm=true;rb.textContent="Click again to reset";setTimeout(()=>{rArm=false;rb.textContent="Reset demo data"},4000);return}
 rArm=false;rb.textContent="Reset demo data";DATA=JSON.parse(JSON.stringify(SEED));save();GDATA=JSON.parse(JSON.stringify(GSEED));gsave();GUI.round=null;GUI.pt=null;GUI.form=null;UI.month=null;UI.sensor=null;UI.edit=false;route();toast("Demo data restored")});
let tt;function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2200)}
document.documentElement.lang="en";
route();
</script>

</body></html>
