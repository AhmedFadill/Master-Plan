<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Master Plan KCML</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: control-room console. Sticky top bar with language/theme; home = activity tiles; module = selector strip, KPI row, table + side chart; report = paper sheet */
:root{
  --bg:#edf0f3; --surface:#ffffff; --sunk:#e5e9ed; --line:#d2d9e0;
  --fg:#15202b; --muted:#5a6876; --accent:#1c5c89; --accent-ink:#ffffff; --accent-soft:#d8e6f0;
  --ok:#1a7a4a; --ok-soft:#d8efe2; --warn:#a36100; --warn-soft:#f9e9cf; --bad:#b2251d; --bad-soft:#f6d9d6; --na:#788694; --na-soft:#e3e8ec;
  --shadow:0 1px 2px rgba(16,32,48,.06),0 4px 14px rgba(16,32,48,.05);
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-disp:"IBM Plex Sans Condensed","IBM Plex Sans Arabic","Arial Narrow",sans-serif;
  --f-mono:"IBM Plex Mono","IBM Plex Sans Arabic",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1218; --surface:#141d26; --sunk:#1a2530; --line:#273644;
  --fg:#e4ebf1; --muted:#91a1af; --accent:#6aaee0; --accent-ink:#09141e; --accent-soft:#1a3144;
  --ok:#58c78b; --ok-soft:#153224; --warn:#e7a849; --warn-soft:#372911; --bad:#ef887e; --bad-soft:#3a1917; --na:#8594a1; --na-soft:#212e39;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1218; --surface:#141d26; --sunk:#1a2530; --line:#273644;
  --fg:#e4ebf1; --muted:#91a1af; --accent:#6aaee0; --accent-ink:#09141e; --accent-soft:#1a3144;
  --ok:#58c78b; --ok-soft:#153224; --warn:#e7a849; --warn-soft:#372911; --bad:#ef887e; --bad-soft:#3a1917; --na:#8594a1; --na-soft:#212e39;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;padding:0 16px 48px}
[dir="rtl"] body{font-size:15.5px}
.wrap{max-width:1140px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-disp);text-wrap:balance;margin:0}
button,input,select{font:inherit}
button:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);margin-inline:-16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.topin{max-width:1140px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--fg);min-width:0}
.mark{width:38px;height:38px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand b{display:block;font-family:var(--f-disp);font-size:1.18rem;font-weight:700;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:.78rem}
.tools{display:flex;align-items:center;gap:8px}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font-weight:600;font-size:.84rem}
.tbtn:hover{border-color:var(--accent)}
.tbtn.icon{width:36px;padding:0;justify-content:center}
.badge-demo{font-size:.68rem;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.08em}

main{padding-top:22px;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
[dir="rtl"] .eyebrow{letter-spacing:0;font-size:.78rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow)}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 16px;margin-bottom:14px}
.ph h2{font-size:1.2rem;font-weight:600}
.sub{margin:3px 0 0;color:var(--muted);font-size:.85rem}
.crumbs{font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumbs a{color:var(--accent);text-decoration:none;font-weight:600}
.crumbs a:hover{text-decoration:underline}
.mtitle{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.mtitle h1{font-size:clamp(1.5rem,3.4vw,2rem);font-weight:700}

/* home */
.hero h1{font-size:clamp(1.7rem,4vw,2.3rem);font-weight:700}
.hero p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.sec-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sec-t h2{font-size:1.08rem;font-weight:600}
.sec-t span{font-size:.82rem;color:var(--muted)}
.livegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
a.tile{display:flex;flex-direction:column;gap:14px;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);text-decoration:none;box-shadow:var(--shadow);position:relative}
a.tile:hover{border-color:var(--accent)}
a.tile .top{display:flex;gap:14px;align-items:flex-start}
.ico{width:46px;height:46px;border-radius:11px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
a.tile h3{font-size:1.15rem;font-weight:700;line-height:1.3}
a.tile .d{font-size:.82rem;color:var(--muted);margin-top:2px}
a.tile .stat{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line);margin-top:auto}
a.tile .k{font-size:.76rem;color:var(--muted)}
a.tile .v{font-family:var(--f-mono);font-size:2rem;font-weight:600;line-height:1.15}
a.tile .go{font-weight:600;color:var(--accent);font-size:.88rem;white-space:nowrap}
.agroup{display:flex;flex-direction:column}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
a.at{display:flex;flex-direction:column;gap:8px;justify-content:space-between;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);text-decoration:none;min-height:96px}
a.at:hover{border-color:var(--accent)}
a.at b{font-weight:600;font-size:.94rem;line-height:1.4}
a.at .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem;color:var(--muted)}

/* selectors */
.strip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
@media (max-width:760px){.strip{grid-template-columns:repeat(6,minmax(0,1fr))}}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.mo{color:var(--fg);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;min-width:0;text-align:center}
.mo .m{font-size:.7rem;color:var(--muted);font-weight:600;line-height:1.2}
[dir="ltr"] .mo .m{text-transform:uppercase;letter-spacing:.05em}
.mo .v{font-family:var(--f-mono);font-size:.86rem;font-weight:600}
.mo.ok{background:var(--ok-soft);border-color:transparent} .mo.ok .v{color:var(--ok)}
.mo.warn{background:var(--warn-soft);border-color:transparent} .mo.warn .v{color:var(--warn)}
.mo.bad{background:var(--bad-soft);border-color:transparent} .mo.bad .v{color:var(--bad)}
.mo.ksd{background:var(--sunk);border-color:transparent} .mo.ksd .v,.mo.empty .v{color:var(--muted);font-family:var(--f-body);font-size:.74rem}
.mo.due{border:1.5px dashed var(--accent)} .mo.due .v{color:var(--accent);font-family:var(--f-body);font-size:.74rem}
.mo.add{border-style:dashed;color:var(--accent)} .mo.add .v{font-family:var(--f-body);font-size:.78rem;color:var(--accent)}
.mo.future{opacity:.45;cursor:default}
.mo[aria-current="true"]{box-shadow:0 0 0 2px var(--accent)}
.mo:not(.future):hover{border-color:var(--accent)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--sunk);border-radius:8px;padding:12px 14px;min-width:0}
.kpi .k{color:var(--muted);font-size:.78rem}
.kpi .v{font-family:var(--f-mono);font-size:1.55rem;font-weight:600;line-height:1.3}
.kpi .v small{font-size:.85rem;color:var(--muted);font-weight:500}
.kpi .h{font-size:.76rem;color:var(--muted)}
.c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)} .c-na{color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-na{background:var(--na-soft);color:var(--na)}
.tag{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:4px;white-space:nowrap}
.tag.live{color:var(--ok);background:var(--ok-soft)}
.tag.next{color:var(--muted);background:var(--sunk)}

/* tables */
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:920px){.split{grid-template-columns:1fr}}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
.tw{min-width:660px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--sunk);font-weight:600;color:var(--muted);font-size:.74rem;white-space:nowrap}
[dir="ltr"] th{text-transform:uppercase;letter-spacing:.04em;font-size:.7rem}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:end}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td .code{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);margin-inline-start:6px}
td.loc{font-weight:600}
tr.gstart td{border-top:2px solid var(--line)}
tbody tr.pick{cursor:pointer}
tbody tr.pick:hover td:first-child,tbody tr[aria-current="true"] td:first-child{color:var(--accent)}
tbody tr[aria-current="true"] td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
[dir="rtl"] tbody tr[aria-current="true"] td:first-child{box-shadow:inset -3px 0 0 var(--accent)}
.flag{display:block;font-size:.75rem;color:var(--warn);margin-top:2px;font-family:var(--f-body);white-space:normal}
tr.excl td{color:var(--na)}
.cnt{display:inline-block;font-size:.66rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 5px;margin-inline-start:5px;vertical-align:1px;font-family:var(--f-body)}
.vals{display:block;font-size:.7rem;color:var(--muted);font-weight:400}
.side{display:flex;flex-direction:column;gap:12px}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.note{font-size:.85rem;background:var(--sunk);border-radius:8px;padding:10px 12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:.85rem}
.meta b{color:var(--fg);font-weight:600}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 24px}
.dl div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.dl div span:first-child{color:var(--muted)}
.dl div span:last-child{font-family:var(--f-mono);font-weight:600}
.twocharts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.78rem;color:var(--muted);align-items:center}
.sw{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-inline-end:6px}
.findings{display:flex;flex-direction:column;gap:8px}
.finding{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;padding:12px 14px;border:1px solid var(--line);border-radius:8px}
.finding .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;grid-row:1/3}
.finding .ic.bad{background:var(--bad-soft);color:var(--bad)} .finding .ic.warn{background:var(--warn-soft);color:var(--warn)}
.finding b{font-size:.92rem}
.finding p{margin:0;font-size:.85rem;color:var(--muted)}

/* buttons & forms */
.btn{font-weight:600;font-size:.86rem;border-radius:7px;padding:8px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.link{border-color:transparent;background:none;color:var(--muted);padding-inline:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
input{font-size:.9rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
input[aria-invalid="true"]{border-color:var(--bad);background:var(--bad-soft)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.multi{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:flex-end}
.multi input{width:86px;font-family:var(--f-mono);text-align:right;padding:6px 8px}
.addr{width:28px;height:28px;border-radius:6px;border:1px dashed var(--accent);background:none;color:var(--accent);cursor:pointer;font-weight:700;line-height:1}
.mavg{flex-basis:100%;text-align:end;font-size:.72rem;color:var(--accent);font-family:var(--f-mono);min-height:0}
.mavg:empty{display:none}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px 24px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.frow > span{font-size:.86rem}
.frow > span small{display:block;color:var(--muted);font-size:.74rem}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty h3{color:var(--fg);font-size:1.1rem;margin-bottom:6px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.steps div{background:var(--sunk);border-radius:8px;padding:12px 14px;font-size:.86rem}
.steps div b{display:block;margin-bottom:2px}
details.cfg summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.cfg summary::-webkit-details-marker{display:none}
details.cfg summary::after{content:"+";font-family:var(--f-mono);color:var(--accent);font-size:1.2rem}
details.cfg[open] summary::after{content:"−"}
.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.88rem;font-weight:600;z-index:20}
footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center}
footer p{margin:0;max-width:78ch}

/* report sheet (explicit paper colors in both themes) */
.paperwrap{overflow-x:auto;padding:4px}
.paper{background:#ffffff;color:#18222c;max-width:860px;min-width:640px;margin:0 auto;padding:38px 42px;font-family:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;font-size:13px;line-height:1.5;border-radius:4px;box-shadow:0 2px 16px rgba(0,0,0,.18)}
.paper .rh{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:3px solid #1c5c89;padding-bottom:12px;margin-bottom:16px}
.paper .rh .org{font-weight:700;font-size:15px;color:#1c5c89}
.paper .rh .doc{font-size:11px;color:#5a6876;text-align:end}
.paper h1{font-size:21px;margin:2px 0 0;font-family:inherit;color:#18222c}
.paper h2{font-size:14px;margin:18px 0 8px;font-family:inherit;color:#1c5c89}
.paper .rmeta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.paper .rmeta div{border:1px solid #d2d9e0;border-radius:4px;padding:6px 9px}
.paper .rmeta span{display:block;font-size:10px;color:#5a6876}
.paper .rmeta b{font-size:12.5px}
.paper .rk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.paper .rk div{background:#f0f3f6;border-radius:4px;padding:9px 10px}
.paper .rk span{display:block;font-size:10.5px;color:#5a6876}
.paper .rk b{font-family:"IBM Plex Mono",monospace;font-size:17px}
.paper table{width:100%;border-collapse:collapse;font-size:11.5px}
.paper th,.paper td{border:1px solid #cfd7de;padding:5px 7px;text-align:start}
.paper th{background:#eef2f5;font-weight:600;color:#3d4a57}
.paper td.n{text-align:end;font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.paper .ok{color:#1a7a4a;font-weight:600} .paper .warn{color:#a36100;font-weight:600} .paper .bad{color:#b2251d;font-weight:600} .paper .na{color:#788694}
.paper ul{margin:4px 0;padding-inline-start:18px}
.paper .sign{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:34px}
.paper .sign div{border-top:1px solid #18222c;padding-top:5px;font-size:11px;color:#5a6876}
.paper .rf{margin-top:22px;font-size:10px;color:#788694;display:flex;justify-content:space-between;border-top:1px solid #d2d9e0;padding-top:6px}
@media (prefers-reduced-motion:no-preference){a.tile,a.at,.btn,.mo,.tbtn{transition:border-color .15s,background .15s,box-shadow .15s}}
</style>

<header class="topbar"><div class="topin">
  <a class="brand" href="#"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/><circle cx="12" cy="16" r="1.4" fill="var(--accent-ink)"/></svg></span>
   <span><b id="brandName">Master Plan KCML</b><small id="brandSub">Process engineering · 2026</small></span></a>
  <div class="tools">
   <span class="badge-demo" id="demoBadge">Demo</span>
   <button class="tbtn" id="langBtn" type="button">العربية</button>
   <button class="tbtn icon" id="themeBtn" type="button" aria-label="Theme"></button>
  </div>
</div></header>
<div class="wrap">
  <main id="app"></main>
  <footer><p id="footNote"></p><button class="btn link" id="resetBtn" type="button"></button></footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* =================== preferences, i18n =================== */
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let L=store.get("kcml-lang","en");if(L!=="ar"&&L!=="en")L="en";

function fForm(){const ed=FUI.form==="edit";const t=ed?FD.find(x=>x.id===FUI.test):null;const src=t?t.in:(fsorted().slice(-1)[0]||{in:{}}).in;
 const vals=t?t.in:{dust:src.dust,o2:src.o2,co2:src.co2,h2o:src.h2o,prod:src.prod};
 return `<div class="panel"><div class="ph"><div><span class="eyebrow">${ed?tx("Edit test","تعديل الاختبار"):tx("New test","اختبار جديد")}</span><h2>${tx(FAN.name[0],FAN.name[1])}</h2><p class="sub" style="max-width:72ch">${hintMulti()} ${tx("For a Prandtl traverse, enter the flow from each traverse point.","في مسح أنبوب برانتل أدخل تدفق كل نقطة من نقاط المسح.")}</p></div></div>
 <form id="ff" novalidate><div class="formgrid"><label class="f" for="ff-date">${tx("Date","التاريخ")}<input type="date" id="ff-date" value="${t?t.date:NOW.toISOString().slice(0,10)}" dir="ltr"></label>
  <label class="f" for="ff-op">${tx("Recorded by","سجّلها")}<input type="text" id="ff-op" value="${t&&t.op!==XLKEY?esc(t.op):""}" placeholder="${tx("e.g. Eng. Ali","مثال: م. علي")}"></label></div>
 <div class="fgrid">${FFIELDS.map(([k,en,ar,u])=>`<div class="frow"><span>${tx(en,ar)}<small><bdi dir="ltr">${u}</bdi></small></span>${multi("f-"+k,vals[k],tx(en,ar))}</div>`).join("")}</div>
 <div class="note" id="ff-live" style="margin-top:14px"></div>
 <div class="row between" style="margin-top:14px"><span></span><div class="row"><button type="button" class="btn" id="fCancel">${tx("Cancel","إلغاء")}</button><button type="submit" class="btn primary">${tx("Save test","حفظ الاختبار")}</button></div></div>
 <p id="ff-err" style="color:var(--bad);font-size:.85rem;margin:8px 0 0" hidden></p></form></div>`}
function fRead(){let bad=false;const o={};FFIELDS.forEach(([k])=>{const r=readMulti("f-"+k);if(r.bad)bad=true;o[k]=r.v});return {in:o,bad}}
function fLive(){const {in:o}=fRead();const c=fcalc({in:o});document.getElementById("ff-live").innerHTML=c?`${tx("Actual efficiency","الكفاءة الفعلية")} <b class="c-${ecls(c.dEff)}">${ISO(c.effA.toFixed(1)+"%")}</b> · ${tx("expected","المتوقعة")} <b>${c.effT!=null?ISO(c.effT.toFixed(1)+"%"):"—"}</b> · ${tx("deviation","الانحراف")} <b class="c-${ecls(c.dEff)}">${sgn(c.dEff,1)}</b>`:fverdict(null)}
function bindFan(){const fe=document.getElementById("fEdit");if(fe)fe.addEventListener("click",()=>{FUI.form="edit";renderFan()});
 const form=document.getElementById("ff");if(!form)return;form.addEventListener("input",fLive);bindAdd(form,fLive);fLive();
 document.getElementById("fCancel").addEventListener("click",()=>{FUI.form=null;renderFan()});
 form.addEventListener("submit",e=>{e.preventDefault();const err=document.getElementById("ff-err");const {in:o,bad}=fRead();const op=document.getElementById("ff-op").value.trim();const date=document.getElementById("ff-date").value;
  const msg=!date?tx("Choose the date.","اختر التاريخ."):!op?tx("Enter who recorded the readings.","اكتب اسم من سجّل القراءات."):bad?tx("Some fields contain text instead of a number. Correct them or leave them empty.","بعض الخانات فيها نص بدل رقم. صحّحها أو اتركها فارغة."):!fcalc({in:o})?tx("Speed, both pressures, inlet temperature, flow and power are needed, and Δp must fall on the fan curve.","مطلوب: السرعة والضغطان وحرارة المدخل والتدفق والقدرة، ويجب أن يقع Δp ضمن منحنى المروحة."):"";
  if(msg){err.textContent=msg;err.hidden=false;return}
  if(FUI.form==="edit"){const t=FD.find(x=>x.id===FUI.test);Object.assign(t,{in:o,op,date,dayKnown:true})}else{const id="f"+Date.now();FD.push({id,date,dayKnown:true,op,in:o});FUI.test=id}
  store.set(FKEY,FD);FUI.form=null;renderFan();toast(tx("Saved","تم الحفظ"))})}

/* =================== REPORTS =================== */
let RUI=null;let DL=null;
function reportData(kind,id){const gen=new Date().toLocaleDateString(L==="ar"?"ar-IQ-u-nu-latn":"en-GB",{day:"numeric",month:"long",year:"numeric"});
 if(kind==="sensors"){const m=+id;const d=SD[m];if(!d||!d.v)return null;const s=ssum(d.v),x=ssum(d.v,true);const ST=SST();const a=actOf("#sensors");
  const rows=POINTS.map((pt,i)=>{const [p,c]=d.v[i];const r=scalc(p,c);const k=r.ok?scls(r.err):"na";return {k,cells:[pName(pt),pt.id,pt.u,cellTxt(p),cellTxt(c),r.ok?raw(r.diff):"—",r.err==null?"—":(r.err*100).toFixed(1)+"%",ST[k]]}});
  const notes=[];POINTS.forEach((pt,i)=>sflags(m,i).forEach(f=>notes.push(pt.id+": "+f)));
  return {file:`critical-sensor-check-2026-${String(m).padStart(2,"0")}`,title:aName(a),period:smLabel(m),by:opName(d.op),gen,
   kpis:[[tx("Accuracy","الدقة"),pct(s.acc),acls(s.acc)],[tx("In tolerance","ضمن الحد"),`${s.ok} / ${s.n}`,""],[tx("Need calibration","تحتاج معايرة"),String(s.bad),s.bad?"bad":""],[tx("Old Excel formula","معادلة الإكسل القديمة"),pct(x.acc),""]],
   sections:[{h:tx("Readings","القراءات"),head:[tx("Sensor","الحساس"),tx("Code","الرمز"),tx("Unit","الوحدة"),tx("Field","الميدانية"),"CCR",tx("Diff.","الفرق"),tx("Error","الخطأ"),tx("Status","الحالة")],num:[3,4,5,6],rows}],
   notes,foot:tx("Diff. = Field − CCR; Error = Diff. ÷ Field; tolerance ±2% (watch to ±5%). (×n) = average of n readings.","الفرق = الميدانية − غرفة التحكم؛ الخطأ = الفرق ÷ الميدانية؛ الحد ±2% (مراقبة حتى ±5%). (×n) = متوسط n قراءات.")}}
 if(kind==="gas"){const r=GD[+id];if(!r)return null;const s=gsum(r);const ST=GST();const a=actOf("#gas");
  const rows=GPOINTS.map((pt,i)=>{const [p,c]=r.v[i];const st=gstat(pt,p,c);return {k:st.k,cells:[gLoc(pt),pt.gas,pt.u,cellTxt(p,3),cellTxt(c,3),st.diff==null?"—":raw(st.diff,3),st.err==null?"—":(st.err*100).toFixed(0)+"%",gtolText(pt),ST[st.k]]}});
  const notes=[];GPOINTS.forEach((pt,i)=>gflags(r,i).forEach(f=>notes.push(gpn(pt)+": "+f)));if(r.note)notes.unshift(Array.isArray(r.note)?tx(r.note[0],r.note[1]):r.note);
  return {file:`gas-analyzers-${gYear(r)}-${String(r.m).padStart(2,"0")}${r.r2?"-2":""}`,title:aName(a),period:gLabelLong(r),by:opName(r.op),gen,
   kpis:[[tx("Reliability","الموثوقية"),pct(s.rel,0),rcls(s.rel)],[tx("Within tolerance","ضمن الحد"),`${s.ok} / ${s.n}`,""],[tx("Out of tolerance","خارج الحد"),String(s.bad),s.bad?"bad":""],[tx("Not measured","غير مقاسة"),String(12-s.n),""]],
   sections:[{h:tx("Readings","القراءات"),head:[tx("Location","الموقع"),tx("Gas","الغاز"),tx("Unit","الوحدة"),tx("Field","الميدانية"),"CCR",tx("Diff.","الفرق"),tx("Error","الخطأ"),tx("Tolerance","الحد"),tx("Status","الحالة")],num:[3,4,5,6],rows}],
   notes,foot:tx("O₂ judged by absolute difference (±0.5 vol%); CO and NOx by ±10% with a 20 ppm floor. (×n) = average of n readings.","الأكسجين بالفرق المطلق (±0.5 vol%)؛ CO وNOx بنسبة ±10% مع حد أدنى 20 ppm. (×n) = متوسط n قراءات.")}}
 if(kind==="fan"){const t=FD.find(x=>x.id===id);const c=t&&fcalc(t);if(!c)return null;const a=actOf("#fan");
  return {file:`id-fan-efficiency-${t.date}`,title:aName(a)+" · "+tx(FAN.name[0],FAN.name[1]),period:fLabel(t),by:opName(t.op),gen,
   kpis:[[tx("Actual efficiency","الكفاءة الفعلية"),c.effA.toFixed(1)+"%",ecls(c.dEff)],[tx("Expected (curve)","المتوقعة (المنحنى)"),c.effT.toFixed(1)+"%",""],[tx("Efficiency deviation","انحراف الكفاءة"),(c.dEff>0?"+":"")+c.dEff.toFixed(1)+" "+tx("pts","نقطة"),ecls(c.dEff)],[tx("Power deviation","انحراف القدرة"),(c.dPow>0?"+":"")+c.dPow.toFixed(1)+"%",powcls(c.dPow)]],
   sections:[{h:tx("Measured values","القيم المقاسة"),head:[tx("Parameter","البند"),tx("Value","القيمة"),tx("Unit","الوحدة")],num:[1],rows:FFIELDS.map(([k,en,ar,u])=>({cells:[tx(en,ar),cellTxt(t.in[k],k==="q"||k==="prod"?0:2),u]}))},
    {h:tx("Results","النتائج"),head:[tx("Parameter","البند"),tx("Value","القيمة"),tx("Unit","الوحدة")],num:[1],rows:[
     [tx("Actual gas density","كثافة الغاز الفعلية"),raw(c.rho,4),"kg/m³"],[tx("Fan pressure rise Δp","ارتفاع ضغط المروحة Δp"),raw(c.dp,2),"mbar"],[tx("Shaft power (measured)","قدرة العمود (مقاسة)"),raw(c.shaft,1),"kW"],
     [tx("Actual efficiency range","مدى الكفاءة الفعلية"),c.effMin.toFixed(0)+" – "+c.effMax.toFixed(0),"%"],[tx("Flow from curve at Δp","التدفق من المنحنى عند Δp"),raw(c.qth,0),"m³/h"],[tx("Shaft power from curve (with dust)","قدرة العمود من المنحنى (مع الغبار)"),raw(c.pthD,1),"kW"],
     [tx("Flow deviation","انحراف التدفق"),(c.dFlow>0?"+":"")+c.dFlow.toFixed(1),"%"],[tx("Normalized flow","التدفق المعياري"),raw(c.qn,0),"Nm³/h"],[tx("Specific gas flow","التدفق النوعي"),raw(c.spec,3),"Nm³/kg cl"],[tx("Outlet temperature (estimated)","حرارة المخرج (تقديرية)"),raw(c.toutEst,1),"°C"]].map(r=>({cells:r}))}],
   notes:[fverdict(c)],foot:tx(`η = Q·Δp ÷ P_shaft × (1 + dust ÷ ρ). Supplier curve (${FAN.nmax} rpm, ρ ${FAN.rhoRef} kg/m³) scaled by the fan laws. Flow by ${FAN.instr} ±${FAN.acc*100}%.`,`η = Q·Δp ÷ قدرة العمود × (1 + الغبار ÷ الكثافة). منحنى المورّد (${FAN.nmax} rpm، كثافة ${FAN.rhoRef} kg/m³) معدّل بقوانين المراوح. التدفق مقاس بـ ${FAN.instr} ±${FAN.acc*100}%.`)}}
 return null}
function paperHTML(r){const no="KCML-"+r.file.toUpperCase().replace(/[^A-Z0-9]+/g,"-").slice(0,40);
 return `<div class="rh"><div><div class="org">KCML · ${tx("Process Engineering","هندسة العمليات")}</div><h1>${esc(r.title)}</h1></div><div class="doc">${tx("Master Plan 2026","الخطة الرئيسية 2026")}<br>${no}</div></div>
 <div class="rmeta"><div><span>${tx("Period / date","الفترة / التاريخ")}</span><b>${esc(r.period)}</b></div><div><span>${tx("Recorded by","سجّلها")}</span><b>${esc(r.by)}</b></div><div><span>${tx("Report generated","تاريخ التقرير")}</span><b>${esc(r.gen)}</b></div><div><span>${tx("Status","الحالة")}</span><b>${tx("For review","للمراجعة")}</b></div></div>
 <div class="rk">${r.kpis.map(k=>`<div><span>${k[0]}</span><b class="${k[2]||""}">${k[1]}</b></div>`).join("")}</div>
 ${r.sections.map(s=>`<h2>${s.h}</h2><table><thead><tr>${s.head.map((h,i)=>`<th${s.num.includes(i)?' style="text-align:end"':""}>${h}</th>`).join("")}</tr></thead><tbody>${s.rows.map(row=>`<tr>${row.cells.map((v,i)=>`<td class="${s.num.includes(i)?"n":""} ${i===row.cells.length-1&&row.k?row.k:""}"><bdi>${esc(v)}</bdi></td>`).join("")}</tr>`).join("")}</tbody></table>`).join("")}
 ${r.notes.length?`<h2>${tx("Observations","الملاحظات")}</h2><ul>${r.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}
 <p style="font-size:10.5px;color:#5a6876;margin-top:10px">${esc(r.foot)}</p>
 <div class="sign"><div>${tx("Prepared by","أعدّه")}</div><div>${tx("Checked by","دقّقه")}</div><div>${tx("Approved by","اعتمده")}</div></div>
 <div class="rf"><span>${tx("Generated by the Master Plan KCML system (demo)","صادر من نظام الخطة الرئيسية KCML (تجريبي)")}</span><span>${no}</span></div>`}
function renderReport(){if(!RUI){location.hash="";return}const r=reportData(RUI.kind,RUI.id);if(!r){location.hash="";return}
 const back={sensors:"#sensors",gas:"#gas",fan:"#fan"}[RUI.kind];
 app().innerHTML=`<nav class="crumbs"><a href="#">${tx("Home","الرئيسية")}</a><span aria-hidden="true">/</span><a href="${back}">${esc(r.title)}</a><span aria-hidden="true">/</span><span style="color:var(--fg)">${tx("Report","التقرير")}</span></nav>
 <div class="mtitle"><div><span class="eyebrow">${tx("Report preview","معاينة التقرير")}</span><h1>${esc(r.period)}</h1></div>
  <div class="row">${DL?`<button class="btn primary" id="saveRep" type="button">${tx("Save for printing (HTML)","حفظ للطباعة (HTML)")}</button><button class="btn" id="saveCsv" type="button">${tx("Export to Excel (CSV)","تصدير إلى Excel (CSV)")}</button>`:""}<a class="btn" href="${back}">${tx("Back","رجوع")}</a></div></div>
 ${DL?`<p class="sub">${tx("The saved file opens in your browser with the print dialog ready, A4 layout, with signature lines.","الملف المحفوظ يُفتح في المتصفح ونافذة الطباعة جاهزة، بمقاس A4 مع خانات التوقيع.")}</p>`:`<p class="sub">${tx("Saving files isn't available in this view. In the full system this page prints directly.","حفظ الملفات غير متاح في هذا العرض. في النظام الكامل تُطبع هذه الصفحة مباشرة.")}</p>`}
 <div class="paperwrap"><div class="paper" dir="${L==="ar"?"rtl":"ltr"}">${paperHTML(r)}</div></div>`;
 const sr=document.getElementById("saveRep");if(sr)sr.addEventListener("click",()=>doSave(r.file+".html",reportFile(r)));
 const sc=document.getElementById("saveCsv");if(sc)sc.addEventListener("click",()=>doSave(r.file+".csv",reportCSV(r)))}
function reportFile(r){const css=[...document.querySelectorAll("style")].map(s=>s.textContent).join("").match(/\.paper[^{]*\{[^}]*\}/g).join("\n");
 return `<!doctype html><html lang="${L}" dir="${L==="ar"?"rtl":"ltr"}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(r.title)} · ${esc(r.period)}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>body{margin:0;background:#e9edf1;padding:24px}${css}\n@page{size:A4;margin:12mm}@media print{body{background:#fff;padding:0}.paper{box-shadow:none;max-width:none;min-width:0;padding:0}}</style></head>
<body><div class="paper">${paperHTML(r)}</div><script>window.addEventListener("load",function(){setTimeout(function(){window.print()},400)})<\/script></body></html>`}
function reportCSV(r){const clean=s=>String(s).replace(/[⁦-⁩]/g,"");const q=s=>{s=clean(s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
 const lines=[[r.title],[r.period],[tx("Recorded by","سجّلها"),r.by],[]];r.kpis.forEach(k=>lines.push([k[0],k[1]]));
 r.sections.forEach(s=>{lines.push([]);lines.push([s.h]);lines.push(s.head);s.rows.forEach(row=>lines.push(row.cells))});
 if(r.notes.length){lines.push([]);lines.push([tx("Observations","الملاحظات")]);r.notes.forEach(n=>lines.push([n]))}
 return "﻿"+lines.map(l=>l.map(q).join(",")).join("\r\n")}
async function doSave(filename,data){if(!DL)return;try{await DL.save({filename,data});toast(tx("File saved","تم حفظ الملف"))}catch(e){const c=e&&e.code;
 if(c==="declined")return;toast(c==="rate_limited"?tx("Another save is still open. Try again in a moment.","هناك عملية حفظ مفتوحة. حاول بعد لحظة."):tx("Saving isn't available here.","الحفظ غير متاح هنا."));if(c==="unavailable"||c==="not_granted"){DL=null;route()}}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-report]");if(!b)return;const [kind,id]=b.dataset.report.split(":");RUI={kind,id};if(location.hash==="#report")route();else location.hash="report"});

function chrome(){document.getElementById("brandName").textContent=tx("Master Plan KCML","الخطة الرئيسية KCML");document.getElementById("brandSub").textContent=tx("Process engineering · 2026","هندسة العمليات · 2026");
 document.getElementById("demoBadge").textContent=tx("Demo","تجريبي");document.getElementById("langBtn").textContent=L==="ar"?"English":"العربية";
 const tb=document.getElementById("themeBtn");const dark=isDark();tb.innerHTML=dark?`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`:`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
 tb.setAttribute("aria-label",dark?tx("Switch to light mode","التبديل إلى الوضع النهاري"):tx("Switch to dark mode","التبديل إلى الوضع الليلي"));tb.title=tb.getAttribute("aria-label");
 document.getElementById("footNote").textContent=tx("Demo version: data is saved in this browser only. The full system runs on a server inside the plant network with one shared database for every device, user accounts and permissions.","نسخة تجريبية: البيانات محفوظة في هذا المتصفح فقط. النظام الكامل يعمل على سيرفر داخل شبكة المعمل بقاعدة بيانات واحدة مشتركة لكل الأجهزة، مع حسابات المستخدمين والصلاحيات.");
 document.getElementById("resetBtn").textContent=tx("Reset demo data","إعادة البيانات التجريبية");document.title=tx("Master Plan KCML","الخطة الرئيسية KCML")}
function route(){chrome();const h=location.hash;
 if(h==="#sensors")renderSensors();else if(h==="#gas")renderGas();else if(h==="#fan")renderFan();else if(h==="#report")renderReport();else if(h.startsWith("#act-"))renderAct(h.slice(5));else renderHome()}
window.addEventListener("hashchange",()=>{SUI.edit=false;GUI.form=null;FUI.form=null;route();window.scrollTo({top:0})});
document.getElementById("langBtn").addEventListener("click",()=>{L=L==="ar"?"en":"ar";store.set("kcml-lang",L);applyPrefs();route()});
document.getElementById("themeBtn").addEventListener("click",()=>{THEME=isDark()?"light":"dark";store.set("kcml-theme",THEME);applyPrefs();chrome()});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>chrome());
let rArm=false;const rb=document.getElementById("resetBtn");rb.addEventListener("click",()=>{if(!rArm){rArm=true;rb.textContent=tx("Click again to reset","اضغط مرة أخرى للتأكيد");setTimeout(()=>{rArm=false;chrome()},4000);return}
 rArm=false;SD=JSON.parse(JSON.stringify(SSEED));GD=JSON.parse(JSON.stringify(GSEED));FD=JSON.parse(JSON.stringify(FSEED));store.set(SKEY,SD);store.set(GKEY,GD);store.set(FKEY,FD);
 Object.assign(SUI,{month:null,sensor:null,edit:false});Object.assign(GUI,{round:null,pt:null,form:null});Object.assign(FUI,{test:null,form:null});route();toast(tx("Demo data restored","أُعيدت البيانات التجريبية"))});
applyPrefs();route();
if(window.claude&&window.claude.use){window.claude.use("downloads").then(d=>{DL=d;if(d&&location.hash==="#report")route()}).catch(()=>{})}
</script>
